name: Bug report
description: Something did not work the way this repository says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Use the private advisories form instead.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The command you ran and its output, copied as text.
      placeholder: |
        $ tmux-llm-rescue
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: '`tmux-llm-rescue --version`, or the commit you built.'
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: 'OS and version, and the command you ran, including the flags.'
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A small reproduction, or what you already tried.
    validations:
      required: false
