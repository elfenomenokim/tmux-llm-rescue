[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-llm-rescue"
version = "0.1.1"
description = "A command-line tool for recovering Claude Code, Codex and Kimi sessions after a tmux crash."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
tmux-llm-rescue = "tmux_llm_rescue.cli:main"

[tool.setuptools.packages.find]
include = ["tmux_llm_rescue*"]
